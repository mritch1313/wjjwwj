name: CI

# Порядок намеренно «сначала дешёвое»: быстрые проверки (секунды) отсекают
# опечатки до того, как запустятся headless-тесты (десятки секунд) и сборка
# Android (минуты). Каждый следующий job зависит от предыдущего, поэтому
# сломанный скрипт не тратит время на Gradle/шаблоны.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Один прогон на ветку: новый пуш отменяет предыдущий, чтобы не жечь минуты
# на устаревшем коммите.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "4.7.2-stable"
  # Версия ключа кэша: меняется вместе с движком/шаблонами, а не с кодом.
  CACHE_VERSION: v1

jobs:
  # ---------------------------------------------------------------- fast checks
  validate:
    name: Fast validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gdtoolkit (GDScript linter/parser)
        run: pip install --disable-pip-version-check "gdtoolkit==4.*"

      - name: Lint every GDScript (gdlint)
        run: gdlint scripts tests tools

      - name: Parse every GDScript (gdparse)
        run: |
          find scripts tests -name '*.gd' -print0 | xargs -0 -n1 gdparse > /dev/null
          echo "разобрано скриптов: $(find scripts tests -name '*.gd' | wc -l)"

      - name: Art pipeline consistency (assets <-> library <-> generator)
        run: python3 tools/check_assets.py

      - name: Project sanity (portrait, package name, resources referenced)
        run: python3 tools/check_project.py

  # --------------------------------------------------------------- headless tests
  tests:
    name: Headless tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot editor binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-editor-${{ env.CACHE_VERSION }}-${{ env.GODOT_RELEASE }}-linux-x86_64

      - name: Download Godot editor (only on a cache miss)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          curl -fL --retry 3 -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q -o /tmp/godot.zip -d ~/godot-bin
          chmod +x ~/godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64

      - name: Godot version
        run: ~/godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64 --version

      - name: Import resources (head-less)
        run: |
          ~/godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64 --headless --path . --import \
            | tee /tmp/import.log
          # `--import` exits with 0 even when a script fails to compile, so the
          # log is what decides whether the project is healthy.
          if grep -q "SCRIPT ERROR" /tmp/import.log; then
            grep -A 3 "SCRIPT ERROR" /tmp/import.log
            exit 1
          fi

      - name: Run the test suite (Godot head-less)
        run: |
          set -o pipefail
          timeout 900 ~/godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64 --headless --path . \
            res://tests/test_runner.tscn 2>&1 | tee /tmp/tests.log
          grep -E "Файлов тестов|TESTS (PASSED|FAILED)" /tmp/tests.log
          # Ошибка скрипта внутри теста обрывает проверку на середине, а тест
          # при этом печатает "ok": лог обязан быть чистым.
          if grep -q "SCRIPT ERROR" /tmp/tests.log; then
            grep -A 3 "SCRIPT ERROR" /tmp/tests.log
            echo "::error::ошибка скрипта во время тестов — часть проверок не выполнилась"
            exit 1
          fi
          # A runner with zero loaded files prints "TESTS PASSED" too, so the
          # number of files is asserted as well.
          if ! grep -qE "Файлов тестов: ([1-9][0-9]*)" /tmp/tests.log; then
            echo "::error::ни один файл тестов не загрузился"
            exit 1
          fi
          if grep -q "TESTS FAILED" /tmp/tests.log; then
            exit 1
          fi
          if grep -q "leaked at exit" /tmp/tests.log; then
            echo "::error::утечка объектов (ObjectDB leaks) — тесты обязаны оставлять сцену чистой"
            exit 1
          fi

      - name: Smoke test of the assembled game (world + car + police)
        run: |
          set -o pipefail
          timeout 1200 ~/godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64 --headless --path . \
            res://tools/smoke_run.tscn 2>&1 | tee /tmp/smoke.log
          if grep -q "SCRIPT ERROR" /tmp/smoke.log; then
            grep -A 3 "SCRIPT ERROR" /tmp/smoke.log
            exit 1
          fi
          grep -E "проверок .* неудачных|SMOKE (PASSED|FAILED)" /tmp/smoke.log
          if ! grep -q "SMOKE PASSED" /tmp/smoke.log; then
            echo "::error::смоук-тест собранной игры не прошёл"
            exit 1
          fi

      - name: Test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-test-log
          path: |
            /tmp/tests.log
            /tmp/smoke.log
          if-no-files-found: warn

  # ---------------------------------------------------------------- android apk
  android:
    name: Android export (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot editor + export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-android-${{ env.CACHE_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Install Godot editor and Android export templates
        run: |
          set -euo pipefail
          mkdir -p ~/godot-bin
          if [ ! -x ~/godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64 ]; then
            curl -fL --retry 3 -o /tmp/godot.zip \
              "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
            unzip -q -o /tmp/godot.zip -d ~/godot-bin
            chmod +x ~/godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64
          fi
          TEMPLATES="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ ! -f "$TEMPLATES/android_release.apk" ]; then
            curl -fL --retry 3 -o /tmp/templates.tpz \
              "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
            mkdir -p "$TEMPLATES"
            unzip -q -o /tmp/templates.tpz -d /tmp/templates-unpacked
            cp -R /tmp/templates-unpacked/templates/. "$TEMPLATES/"
            rm -rf /tmp/templates-unpacked /tmp/templates.tpz
          fi
          ls -1 "$TEMPLATES" | head
          ~/godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64 --version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (build-tools for apksigner/zipalign)
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [ ! -d "$SDK/build-tools" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platform-tools" "platforms;android-34"
          fi
          find "$SDK/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -1

      - name: Create a release keystore
        run: |
          set -euo pipefail
          # Ключ генерируется на каждый прогон: CI-подпись нужна только чтобы
          # доказать, что release-APK действительно собирается и подписывается.
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.keystore" \
            -storetype PKCS12 -alias chase -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass chaseci -keypass chaseci -dname "CN=Chase CI, O=wjjwwj, C=PL"
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.keystore"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=chase"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=chaseci"
          } >> "$GITHUB_ENV"

      - name: Build the APK (head-less export)
        run: |
          # Свежие editor settings: пути к SDK/JDK берутся из ANDROID_HOME/JAVA_HOME,
          # поэтому кэшированный от прошлого прогона файл настроек недопустим.
          rm -f "$HOME/.config/godot/editor_settings-4.7.tres"
          GODOT_BIN="$HOME/godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64" \
            bash tools/build_android.sh release apk

      - name: Verify the APK (manifest, ABI, signature)
        run: |
          set +e
          python3 tools/verify_apk.py build/android/chase-open-world-release.apk 2>&1 | tee /tmp/verify-apk.log
          code=${PIPESTATUS[0]}
          # Отчёт печатается ещё и аннотациями: логи прогонов бывают недоступны
          # (в CI они лежат в закрытом для песочницы хранилище), а аннотации
          # читаются через API — так причина падения видна без выгрузки логов.
          if [ $code -ne 0 ]; then
            tail -n 12 /tmp/verify-apk.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
          fi
          exit $code

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: chase-open-world-apk
          path: build/android/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Export/import log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-export-log
          path: /tmp/godot_*.log
          if-no-files-found: warn
